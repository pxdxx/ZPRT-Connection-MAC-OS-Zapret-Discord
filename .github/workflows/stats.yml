name: stats

# Раз в сутки берёт реальные просмотры репозитория из GitHub Traffic API и
# кладёт их в views.json на ветке `badges`, откуда их читает бейдж в README.
# Traffic API доступен только с токеном, у которого есть доступ Administration
# (read) к этому репозиторию, поэтому нужен секрет TRAFFIC_TOKEN.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  traffic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: badges

      - name: Fetch traffic and update badge data
        env:
          GH_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::Секрет TRAFFIC_TOKEN не задан, обновление пропущено"
            exit 0
          fi
          read VIEWS UNIQUES < <(gh api "repos/$REPO/traffic/views" --jq '"\(.count) \(.uniques)"')
          printf '{"schemaVersion":1,"label":"просмотры за 14 дней","message":"%s (%s уник.)","color":"8b6cff"}\n' \
            "$VIEWS" "$UNIQUES" > views.json
          cat views.json

      - name: Commit if changed
        run: |
          if git diff --quiet -- views.json; then
            echo "Без изменений"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add views.json
          git commit -m "Update traffic badge data"
          git push
